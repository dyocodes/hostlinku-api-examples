name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shell scripts
        run: for f in examples/curl/*.sh; do bash -n "$f"; done
      - name: Check Node.js scripts
        run: for f in examples/node/*.mjs; do node --check "$f"; done
      - name: Check Python scripts
        run: python -m py_compile examples/python/*.py
